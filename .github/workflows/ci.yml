name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q app main.py tests

      - name: Run unit tests (no Minecraft / no Java needed)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  full-pipeline-smoke:
    name: Full Pipeline Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q app main.py

      - name: Run full Minecraft pipeline smoke test
        env:
          RUN_MINECRAFT_E2E: "1"
          CI_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Upload Minecraft diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-e2e-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore
